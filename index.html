
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Valentine ❤️</title>
<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#ff4e8a,#ff9ecb);
color:white;
text-align:center;
}
.container{padding:20px;}
.slideshow{
max-width:300px;
margin:auto;
border-radius:15px;
overflow:hidden;
}
.slideshow img{
width:100%;
border-radius:15px;
}
.message{
background:rgba(255,255,255,0.2);
padding:20px;
border-radius:15px;
margin-top:20px;
}
</style>
</head>
<body>
<div class="container">
<h1>❤️ Happy Valentine's Day ❤️</h1>

<div class="slideshow">
<img id="slide" src="photo1.jpg">
</div>

<div class="message">
baby mujhe pta h ki tm bs mere ho but fir bhi puchhna to bnta h na ...
will u be my valentine forever.. hmesa ke liye...
I love you sweetheart 💋😘😘
</div>

<h2>Our Song 🎵</h2>

<iframe src="https://open.spotify.com/embed/track/5bHDGWyIFML1LYXZWTD5MF"
width="300" height="380" frameborder="0"></iframe>

</div>

<script>
let images=["photo1.jpg","photo2.jpg","photo3.jpg","photo4.jpg","photo5.jpg"];
let i=0;
setInterval(function(){
i=(i+1)%images.length;
document.getElementById("slide").src=images[i];
},2000);
</script>

</body>
</html>
